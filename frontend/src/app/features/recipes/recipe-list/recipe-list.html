<div class="page-header">
  <h1>Recipes</h1>
  <button mat-flat-button color="primary" routerLink="/recipes/new">
    <mat-icon>add</mat-icon>
    New recipe
  </button>
</div>

@if (recipes().length === 0) {
  <p>No recipes yet. Create your first one!</p>
} @else {
  <div class="table-scroll">
    <table mat-table [dataSource]="recipes()" class="full-width">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let recipe">{{ recipe.name }}</td>
      </ng-container>

      <ng-container matColumnDef="servings">
        <th mat-header-cell *matHeaderCellDef>Servings</th>
        <td mat-cell *matCellDef="let recipe">{{ recipe.servings }}</td>
      </ng-container>

      <ng-container matColumnDef="estimatedCost">
        <th mat-header-cell *matHeaderCellDef>Estimated cost</th>
        <td mat-cell *matCellDef="let recipe">{{ recipe.estimatedCost | currency }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let recipe">
          <a mat-icon-button [routerLink]="['/recipes', recipe.id, 'edit']" aria-label="Edit">
            <mat-icon>edit</mat-icon>
          </a>
          <button mat-icon-button (click)="delete(recipe)" aria-label="Delete">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
}
