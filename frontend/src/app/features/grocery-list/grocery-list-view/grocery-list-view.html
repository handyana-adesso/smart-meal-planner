<div class="page-header">
  <h1>Grocery list</h1>
</div>
<p class="mock-data-notice">
  Preview data only — this screen will connect to the Java Grocery &amp; Meal Plan API once it's built.
</p>

<form [formGroup]="form" (ngSubmit)="add()" class="inline-add-form">
  <mat-form-field appearance="outline">
    <mat-label>Item</mat-label>
    <input matInput formControlName="name" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Quantity</mat-label>
    <input matInput type="number" formControlName="quantity" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Unit</mat-label>
    <input matInput formControlName="unit" />
  </mat-form-field>

  <button mat-flat-button color="primary" type="submit">
    <mat-icon>add</mat-icon>
    Add
  </button>
</form>

@if (items().length === 0) {
  <p>Your grocery list is empty.</p>
} @else {
  <mat-list>
    @for (item of items(); track item.id) {
      <mat-list-item>
        <mat-checkbox [checked]="item.isChecked" (change)="toggle(item)"></mat-checkbox>
        <span [class.checked-item]="item.isChecked">{{ item.name }} — {{ item.quantity }} {{ item.unit }}</span>
        <button mat-icon-button (click)="remove(item)" aria-label="Remove">
          <mat-icon>delete</mat-icon>
        </button>
      </mat-list-item>
    }
  </mat-list>
}
