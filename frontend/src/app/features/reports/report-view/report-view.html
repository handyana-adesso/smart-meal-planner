<h1>Monthly spending report</h1>

<form [formGroup]="form" (ngSubmit)="load()" class="report-filters">
  <mat-form-field appearance="outline">
    <mat-label>Month</mat-label>
    <mat-select formControlName="month">
      @for (month of months; track month.value) {
        <mat-option [value]="month.value">{{ month.name }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Year</mat-label>
    <mat-select formControlName="year">
      @for (year of years; track year) {
        <mat-option [value]="year">{{ year }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <button mat-flat-button color="primary" type="submit">View report</button>
</form>

@if (report(); as data) {
  <app-breakdown-list
    [totalAmount]="data.totalAmount"
    [totalCount]="data.totalCount"
    [breakdowns]="data.breakdowns"
  />
}
