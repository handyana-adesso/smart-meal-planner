version: '3.8'

services:
  dotnet-api:
    build:
      context: ../../services/backend-dotnet-recipe-budget
      dockerfile: RecipeBudgetService/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ConnectionStrings__DefaultConnection=${CONNECTION_STRING}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isread -U smart-meal-planner"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: